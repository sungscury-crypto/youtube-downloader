<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 다운로더</title>
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
           max-width: 640px; margin: 60px auto; padding: 0 16px; text-align: center; color: #222; }
    h1 { font-size: 2.2rem; margin-bottom: 28px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    input[type=text] { flex: 1 1 320px; padding: 12px; font-size: 1rem; border: 1px solid #aaa; border-radius: 6px; }
    button { padding: 12px 20px; font-size: 1rem; border: 0; border-radius: 6px; background: #d62828; color: #fff; cursor: pointer; }
    button:disabled { background: #aaa; cursor: default; }
    .types { width: 100%; margin-top: 10px; }

    #box { display: none; margin-top: 32px; text-align: left; }
    .title { font-weight: 600; margin-bottom: 10px; word-break: break-all; }
    .bar { height: 26px; background: #eee; border-radius: 13px; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f77f00, #d62828);
            transition: width .4s ease; }
    .fill.processing { background: repeating-linear-gradient(45deg, #f77f00 0 12px, #fcbf49 12px 24px);
                       animation: move 1s linear infinite; background-size: 34px 34px; }
    @keyframes move { from { background-position: 0 0 } to { background-position: 34px 0 } }
    .row { display: flex; justify-content: space-between; margin-top: 8px; font-size: .95rem; color: #555; }
    .percent { font-size: 1.6rem; font-weight: 700; color: #d62828; }

    table { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: .95rem; }
    td { border-bottom: 1px solid #eee; padding: 8px 4px; }
    td:first-child { color: #888; width: 90px; }

    .error { color: #c00; margin-top: 24px; word-break: break-all; }
    .done a { display: inline-block; margin-top: 16px; padding: 12px 20px; background: #2a9d8f;
              color: #fff; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>유튜브 다운로더</h1>

  <form id="form">
    <input type="text" id="query" placeholder="유튜브 주소 또는 검색어" required>
    <button type="submit" id="btn">다운로드 시작</button>
    <div class="types">
      <label><input type="radio" name="type" value="video" checked> 영상 (mp4)</label>
      &nbsp;&nbsp;
      <label><input type="radio" name="type" value="audio"> 소리만 (mp3)</label>
    </div>
  </form>

  <div id="box">
    <div class="title" id="title"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="row">
      <span class="percent" id="percent">0%</span>
      <span id="stage">준비 중</span>
    </div>
    <table>
      <tr><td>상태</td><td id="t-stage">준비 중</td></tr>
      <tr><td>진행률</td><td id="t-percent">0%</td></tr>
      <tr><td>속도</td><td id="t-speed">-</td></tr>
      <tr><td>남은 시간</td><td id="t-eta">-</td></tr>
    </table>
    <div class="done" id="done"></div>
  </div>

  <p class="error" id="error"></p>

<script>
const $ = id => document.getElementById(id);
let timer = null;

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  clearInterval(timer);
  $("error").textContent = "";
  $("done").innerHTML = "";
  $("title").textContent = "";
  $("box").style.display = "block";
  setProgress({ percent: 0, stage: "준비 중", status: "starting" });
  $("btn").disabled = true;

  const type = document.querySelector("input[name=type]:checked").value;
  try {
    const res = await fetch("/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: $("query").value, type })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "시작하지 못했어요.");
    timer = setInterval(() => check(data.job_id), 1000);
  } catch (err) {
    showError(err.message);
  }
});

async function check(jobId) {
  try {
    const res = await fetch("/progress/" + jobId);
    const p = await res.json();
    if (p.status === "error") return showError(p.error);
    setProgress(p);
    if (p.status === "done") {
      clearInterval(timer);
      $("btn").disabled = false;
      $("done").innerHTML = `<a href="/file/${jobId}">💾 ${p.file_name} 저장하기</a>`;
      window.location.href = "/file/" + jobId;   // 자동으로 저장 시작
    }
  } catch (err) { /* 잠깐 끊겨도 다음 확인 때 다시 시도 */ }
}

function setProgress(p) {
  const pct = (p.percent || 0).toFixed(1) + "%";
  $("fill").style.width = (p.percent || 0) + "%";
  $("fill").classList.toggle("processing", p.status === "processing");
  $("percent").textContent = pct;
  $("stage").textContent = p.stage || "";
  $("t-stage").textContent = p.stage || "-";
  $("t-percent").textContent = pct;
  $("t-speed").textContent = p.speed || "-";
  $("t-eta").textContent = p.eta || "-";
  if (p.title) $("title").textContent = "🎬 " + p.title;
}

function showError(msg) {
  clearInterval(timer);
  $("btn").disabled = false;
  $("box").style.display = "none";
  $("error").textContent = msg;
}
</script>
</body>
</html>
